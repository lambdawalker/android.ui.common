schema: 1
repository: lambdawalker/android.ui.common
title: UI Common
tooling_ref: '1da53392b262c7c3129d2bd645dfd7b34ead81e1'
modules:
  ui-common: UI Common
sources:
  roots: [ui-common/src/main/kotlin]
  manifest: docs/api-inputs.json
  groups:
  - include: ['**/*.kt']
    intro: .project/docs/introductions/api.md
    output: docs/agents/source-reference.md
  examples:
  - source: app/src/main/kotlin/com/apexfission/android/ui/common/sample/DocumentationQuickstart.kt
    target: docs/agents/quickstart.md
    start: '<!-- example: quickstart -->'
    end: '<!-- end-example: quickstart -->'
site:
  backend: astro
  base_url: https://lambdawalker.github.io/android.ui.common/
  pages:
    docs/agents/installation.md: source-integration
    docs/screenshots/README.md: screenshot-policy
media:
  manifests:
  - path: docs/screenshots/documentation.json
    base: .
    collection: captures
    file_key: path
    hash_key: image_sha256
    required_files:
    - docs/assets/screenshots/verification-light.png
    - docs/assets/screenshots/verification-dark.png
    - docs/assets/screenshots/alternate-host.png
    - docs/assets/screenshots/components-light.png
    require_dimensions: true
