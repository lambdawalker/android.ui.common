name: Component validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-candidates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5
      - name: Compile, unit test and lint
        run: ./gradlew :ui-common:testDebugUnitTest :ui-common:lintDebug :app:lintDebug :app:assembleDebug :ui-common:assembleDebugAndroidTest --no-daemon
      - name: Render candidates (not accepted regression baselines)
        run: ./gradlew :ui-common:updateDebugScreenshotTest :app:updateDebugScreenshotTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: component-candidates-and-reports
          path: |
            ui-common/src/screenshotTestDebug/reference
            app/src/screenshotTestDebug/reference
            **/build/reports
          if-no-files-found: error
  interaction:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew :ui-common:connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: component-interaction-reports
          path: ui-common/build/reports/androidTests
